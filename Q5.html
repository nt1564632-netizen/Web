<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 2%;
            flex-direction: row;
        }
        .I{
            display: flex;
        }
        .I1{
            height: 300px;
            width: 200px;
            background-color: aqua;
            display: flex;
            flex-direction: row;
            visibility: 100%;
            
        }
        .I2{
            height: 300px;
            width: 200px;
            background-color: aqua;
            display: flex;
            opacity: 70%;
            flex-direction: row;
        }
        .I3{
            height: 300px;
            width: 200px;
            background-color: aqua;
            display: flex;
            flex-direction: row;
            opacity: 40%;
        }
        h1{
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="I">
    <div class="I1">
        <h1>H1</h1>

    </div>
    <div class="I2">
        <h1>H2</h1>

    </div>
    <div class="I3"><h1> H3 </h1></div>

    </div>
</body>
</html>
