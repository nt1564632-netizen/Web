<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{
            display: flex;
            justify-content: left;
            align-items: left;
            text-align: left;
        }
        h2{
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        h3{
            display: flex;
            justify-content: right;
            align-items: right;
            text-align: right;
        }

    </style>
</head>
<body>
    <h1>
        Heading 1
    </h1>
    <h2> Heading 2</h2>
    <h3> Heading 3</h3>
</body>
</html>
