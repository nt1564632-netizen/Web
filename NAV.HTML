<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be A Programmer</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .u{
            display: flex;
            background-color:brown;
            text-align: center;
            height:40px;
            width: 100%;
        }
        .main{
                display: flex;
                height:120px;
                width:100%;
                justify-content: space-between;
                padding: 20px;
                background-color:pink;
        }
        .I1{
            font-size: large;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 50%;
        }
        .I2{
            font-size: large;
            width:50%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex: content ;
        }
        .span{
            display: flex;
        }
        img{
            width:200px;
            display:flex;
            height:90px;
            justify-content: center;
            align-items: center;
        }
        .I3{
            display: flex;
        }
        .ul{
            display: flex;
            align-items: center;
            flex-direction: row;
            gap: 40px;
        }
        li{
            list-style: none;
        }

    </style>
</head>
<body>
    <header>
        <div class="u">
           <div class="I1">📞+91 8675764738</div>
           <div class="I2">📞+91 8675764738</div>
        </div>
        <div class="main">
           <span><img src="Screenshot 2026-06-05 170241.png"></span>
           <div class="I3">
               <ul class="ul">
                   <li>Home</li> 
                   <li>About</li> 
                   <li>courses</li>
                   <li>Content</li>
                </ul>

            </div>
        </div>
    </header>
</body>
</html>
