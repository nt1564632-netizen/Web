<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{
            font-size: 70px;
        }
        p{
            font-size: 40px;
        }
        img{
            width: 700px;
        }
        @media (max-width:576px){
            h1{
                font-size: 30px;
            }
            p{
                font-size: 10px;
            }
            img{
                width:200px ;
                height: auto;
            }
        }
        @media(max-width:992px){
             h1{
                font-size: 30px;
            }
            p{
                font-size: 20px;
            }
            img{
                width:300px ;
                height: auto;
            }
        }
        @media(max-width:1200px){
             h1{
                font-size: 40px;
            }
            p{
                font-size: 25px;
            }
            img{
                width:400px ;
                height: auto;
            }
        }        
    </style>
</head>
<body>
    <h1>This is Heading</h1>
    <p>Lorem ipsum dolor, sit amet consectetur adipisicing elit. Excepturi ut corporis vitae mollitia nemo soluta dolore saepe officiis ex. Voluptate ducimus quia neque quibusdam nam quasi repellat perferendis excepturi. </p>
    <img src="images.jpg">
</body>
</html>
