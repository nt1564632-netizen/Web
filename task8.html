<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student form</title>
    <style>
        div{
            background-color: bisque;
            margin:100;
            padding:0%;
            height: 300px;
            width: 600px;
        }
    </style>
</head>
<body>
    <div>
    <h1><u>Complete Student form</u></h1>
    <form>
        <label>Name: </label>
        <input type="text" placeholder="Enter name here" id="name">
        <br>
        <br>
        <label>Course</label>
        <select>
            <option>Btech</option>
            <option>Mtech</option>
            <option>Bsc</option>
        </select>
        <br>
        <br>
        <label>Intrest: </label>
        <input type="checkbox" id="Intrest" value="IOT">
        <label>IOT</label>
        <input type="checkbox" id="Intrest" value="Cyber Security">
        <label>Cyber Security</label>
        <br>
        <br>
        <label>Branch: </label>
        <input type="radio" id="Branch" value="CSE">
        <label>CSE</label>
        <input type="radio" id="Branch" value="ECE">
        <label>ECE</label>
        <input type="radio" id="Branch" value="CIVIL">
        <label>CIVIL</label>
    </form>
</div>
</body>
</html>
