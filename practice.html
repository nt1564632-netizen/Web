<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
     
        .header{
            height: 40px;
            background-color: blueviolet;
            text-align: center;
            border: double;
        }
       
        .nav{
            height:40px;
            border: double;
            text-align: center;
        }
        .main{
            display: flex;
            border: none;
            padding: 0%;
        }
        .left{
            width: 70%;
            border: none;
            padding: 0%;
            border: double;
        }
         .right{
            width: 30%;
            background-color:aqua ;
            text-align: center;
        }
        .section{
            border: 1px #999;
            border: double;
            text-align: center;
        }
        .article{
            text-align: center;
        }

        .footer{
            height: 50%;
            background-color: lightgreen;
            text-align: center;

        }
    </style>
</head>
<body>
    <div class="header">
        Header

    </div>
    <div class="nav">
        Nav
    </div>
    <div class="main">
        <div class="left">
            <div class="article">Article</div>
            <div class="section">
            Section
        </div>
        </div>
        <div class="right">Aside</div>
    </div>
    <div class="footer"> Footer </div>
</body>
</html>
