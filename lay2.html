<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            border: solid gray;
        }
        .utility{
            height: 50px;
            background-color:cyan;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .Menu{
            height: 100px;
            background-color:deepskyblue;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .main{
            height: 100px;
            display: flex;
        }
        .left{
            background-color:darkorchid;
            width: 60%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .right{
            width: 40%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .Banner{
            height: 60px;
            width: 100%;
            background-color:red ;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .search{
            width: 100%;
            height: 40px;
            background-color: yellow;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container{
            height: 300px;
            display: flex;
        }
        .pre,.post{
            background-color: greenyellow;
            width: 30%;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;

        }
        .center{
            height: 300px;
            width: 40%;
            background-color: gray;
        }
        .body{
            background-color: orange;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .footer{
            height: 50px;
            background-color:dodgerblue;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="utility">
        Utilities Menu
    </div>

    <div class="main">
        <div class="left">
            Logo 150X100
        </div>
        <div class="right">
            <div class="Banner">
                Banner
            </div>
            <div class="search">
                Search Area
            </div>
        </div>

    </div>

        <div class="Menu">
            Main Menu
        </div>

        <div class="container">
           <div class="pre">
                left
           </div>
           <div class="center">
                <div class="body">
                     Teaser
                </div>
           </div>

          <div class="post">
              right
          </div>
       </div>

    <div class="footer">
        Footer
    </div>
</body>
</html>
